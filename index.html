function getTelegramIds(){let tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.initData) INIT_DATA=tg.initData;if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id) TG_ID=String(tg.initDataUnsafe.user.id);try{let u=new URL(location.href);let q=u.searchParams.get("tg_id");if(q) TG_ID=q;}catch(e){}}

async function refreshMe(){try{let r=await callRBAC({action:"me"});if(r.registered){ME=r.user;document.getElementById('auth').innerHTML=esc(ME.status)+' · '+esc(ME.role)+(r.has_rat?' · 🐀':'');}else{document.getElementById('auth').innerHTML='<button class="btn" onclick="doRegister()">Register</button>';}}catch(e){document.getElementById('auth').textContent=String(e).slice(0,60)}}

async function openMe(){let sheet=document.getElementById('sheet');sheet.innerHTML='Loading…';document.getElementById('modal').classList.add('open');try{let r=await callRBAC({action:"me"});let h='<div style="display:flex;justify-content:space-between"><h3>Me</h3><button class="btn" onclick="closeModal()">Close</button></div>';h+='<div class="vars">'+esc(JSON.stringify(r,null,2))+'</div>';if(!r.registered) h+='<button class="btn" onclick="doRegister()">Register pending</button>';sheet.innerHTML=h;}catch(e){sheet.innerHTML='Error '+esc(String(e))+'<button class="btn" onclick="closeModal()">Close</button>'}}
async function load(){getTelegramIds();try{let tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}let r=await fetch(API);let t=await r.text();let j={};try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,200))}let d=j.result||j;if(d&&d.error) throw new Error(d.error);if(!d.dark) throw new Error('no dark');DATA=d;document.getElementById('interval').textContent=(d.interval?(d.interval/60)+'m':'-');document.getElementById('now').textContent=d.fmt_now||'';document.getElementById('total').textContent=d.total_players??'-';document.getElementById('dark').textContent=d.dark_active??(d.dark?d.dark.length:'0');document.getElementById('topcount').textContent=d.top?d.top.length:'0';document.getElementById('auto').textContent=(d.html_auto===true?'ON':'OFF');document.getElementById('src').textContent=(d.last_success?d.last_success.source:'html');document.getElementById('last').textContent=(d.last_success?(d.last_success.tag+' '+d.last_success.count):'');await refreshMe();switchTab('roster');}catch(e){document.getElementById('content').innerHTML='<span style="color:#fb7185">Error '+esc(String(e))+'</span>';}}
function switchTab(t){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.t===t)});let c=document.getElementById('content');if(!DATA&&t!=='diplomacy'&&t!=='rat'&&t!=='admin'){c.textContent='Loading…';return;}

async function loadDiplomacy(){let c=document.getElementById('content');try{let r=await callDiplo({action:"diplomacy_list"});if(!r.ok){c.innerHTML='<div style="color:#fb7185">'+esc(r.error||'forbidden')+'</div><div class="muted">Need view_diplomacy — R4/R5+</div>';return;}let h='<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="openDiploForm()">+ Contact</button><button class="btn" onclick="openDiploRelationForm()">+ Relation</button></div>';h+='<div style="margin-top:8px"><b>Contacts ('+(r.contacts||[]).length+')</b></div>';(r.contacts||[]).forEach(function(a){h+='<div class="row"><div><b>'+esc(a.tag||'')+'</b> '+esc(a.name||'')+' <span class="muted">'+esc(a.alliance_id||a.id||'')+' · '+esc(a.server_id||'')+'</span><br><span class="muted">'+esc(a.leader||'')+' '+esc(a.contact_telegram||'')+'</span></div><div class="muted">'+esc(a.link||'')+'</div></div>'});h+='<div style="margin-top:8px"><b>Relations ('+(r.relations||[]).length+')</b></div>';(r.relations||[]).forEach(function(a){h+='<div class="row"><div><b>'+esc(a.status||'')+'</b> <span class="muted">'+esc(a.alliance_id||'')+'</span> until '+esc(a.until||'')+'<br>'+esc(a.note||'')+'</div></div>'});let notes=r.notes||[];h+='<div style="margin-top:8px"><b>Notes ('+notes.length+')</b></div>';notes.forEach(function(n){h+='<div class="card" style="margin-top:6px">'+esc(n.text||'')+' <span class="muted">'+(n.private?' 🔒 private':'')+' · '+esc(n.alliance_id||'')+' · '+esc(n.created_by||'')+'</span></div>'});h+='<div class="card" style="margin-top:8px"><label>Quick note</label><input id="diplo_note" class="input" placeholder="text"><label>Alliance ID</label><input id="diplo_note_aid" class="input" placeholder="alliance_id"><label><input type="checkbox" id="diplo_priv"> private</label><button class="btn" onclick="sendDiploNote()">Send note</button></div>';c.innerHTML=h;}catch(e){c.innerHTML='Error '+esc(String(e).slice(0,400))}}
function openDiploForm(){let sheet=document.getElementById('sheet');sheet.innerHTML='<h3>Contact</h3><label>Alliance ID</label><input id="f_aid" class="input"><label>Tag</label><input id="f_tag" class="input"><label>Name</label><input id="f_name" class="input"><label>Server</label><input id="f_srv" class="input" value="390"><label>Leader</label><input id="f_leader" class="input"><label>Telegram</label><input id="f_tg" class="input"><label>Link</label><input id="f_link" class="input"><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="sendDiploContact()">Save</button><button class="btn" onclick="closeModal()">Close</button></div>';document.getElementById('modal').classList.add('open');}

async function loadRat(){let c=document.getElementById('content');try{let r=await callRat({action:"templates_list"});if(!r.ok){c.innerHTML='<div style="color:#fb7185">'+esc(r.error||'forbidden')+'</div><div class="muted">Need rat_access — ask superadmin</div>';return;}let cats=r.categories||[];let tpls=r.templates||{};let h='<div class="muted">Cats: '+cats.map(esc).join(', ')+'</div>';h+='<div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="openRatForm()">+ Template</button><button class="btn" onclick="loadRat()">Reload</button></div>';for(let id in tpls){let t=tpls[id];h+='<div class="card" style="margin-top:8px"><div style="display:flex;justify-content:space-between"><b>'+esc(t.title)+'</b><span class="badge">'+esc(t.category)+'</span></div><div class="muted">'+esc(t.id)+' · by '+esc(t.updated_by||'')+'</div><div style="margin-top:6px"><b>RU</b><div class="vars">'+esc(t.body_ru||'')+'</div><div style="margin-top:4px"><span id="cnt_'+esc(id)+'" class="muted">'+String((t.body_ru||'').length)+' chars</span> <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'ru_'+esc(id)+'\').textContent);alert(\'Copied RU\')">Copy RU</button> <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'en_'+esc(id)+'\').textContent);alert(\'Copied EN\')">Copy EN</button> <button class="btn" onclick="deleteRat(\''+esc(id)+'\')" style="background:#3a1020">Delete</button></div><div id="ru_'+esc(id)+'" style="display:none">'+esc(t.body_ru||'')+'</div><div id="en_'+esc(id)+'" style="display:none">'+esc(t.body_en||'')+'</div></div><div style="margin-top:4px"><b>EN</b><div class="vars">'+esc(t.body_en||'')+'</div></div><div class="muted">Vars highlight: unknown {var} in red</div></div>'; }h+='<div class="card" style="margin-top:8px"><label>Preview vars</label><div class="muted">{alliance_name} {alliance_tag} {server_id} {event_name} {event_date} {event_time} {player_name} — unknown vars подсвечиваются</div></div>';c.innerHTML=h;}catch(e){c.innerHTML='Error '+esc(String(e).slice(0,500))}}
function openRatForm(){let sheet=document.getElementById('sheet');sheet.innerHTML='<h3>Template</h3><label>Title</label><input id="rat_title" class="input"><label>Category</label><input id="rat_cat" class="input" value="События" list="catlist"><datalist id="catlist"><option value="Осада нежити"><option value="Дуэль альянсов"><option value="События"><option value="Дипломатия"><option value="Набор игроков"><option value="Перемирия"><option value="Объявления R4/R5"><option value="Ежедневные уведомления"><option value="Экстренные сообщения"></datalist><label>Body RU (BBCode, vars)</label><textarea id="rat_ru" class="input" style="height:90px"></textarea><label>Body EN</label><textarea id="rat_en" class="input" style="height:90px"></textarea><div class="muted" id="rat_preview"></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="sendRat()">Save</button><button class="btn" onclick="closeModal()">Close</button></div>';let ru=document.getElementById('rat_ru'),en=document.getElementById('rat_en');function upd(){let t=(ru.value||'')+' '+(en.value||'');let vars=["alliance_name","alliance_tag","server_id","event_name","event_date","event_time","player_name"];let re=/\{([^}]+)\}/g,m,unk=[];while(m=re.exec(t)){if(vars.indexOf(m[1])<0) unk.push(m[1])}document.getElementById('rat_preview').innerHTML=unk.length?'<span style="color:#fb7185">Unknown vars: '+unk.map(esc).join(', ')+'</span>':'<span style="color:#4ade80">Vars OK</span>';}

async function sendRat(){let p={action:"template_upsert",title:document.getElementById('rat_title').value.trim(),category:document.getElementById('rat_cat').value.trim(),body_ru:document.getElementById('rat_ru').value,body_en:document.getElementById('rat_en').value};try{let r=await callRat(p);alert(r.ok?'Saved '+r.template.id:r.error);closeModal();loadRat();}catch(e){alert(String(e).slice(0,500))}}
async function deleteRat(id){if(!confirm('Delete '+id+'?'))return;try{let r=await callRat({action:"template_delete",template_id:id});alert(r.ok?'Deleted':r.error);loadRat();}catch(e){alert(String(e).slice(0,500))}}
async function loadAdmin(){let c=document.getElementById('content');try{let r=await callRBAC({action:"admin_list"});if(!r.ok){c.innerHTML='<div style="color:#fb7185">'+esc(r.error)+'</div><div class="muted">Need manage_users (admin/superadmin)</div>';return;}let h='<div class="muted">Total '+r.users.length+'</div>';r.users.forEach(function(u){h+='<div class="card" style="margin-top:6px"><div style="display:flex;justify-content:space-between"><b>'+esc(u.tg_id)+'</b><span class="badge">'+esc(u.status)+' · '+esc(u.role)+(u.has_rat?' · 🐀':'')+'</span></div><div class="muted">'+esc(u.username||'')+' linked '+esc(u.linked_player_id||'—')+'</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="adminAct(\'admin_approve\',\''+esc(u.tg_id)+'\')">Approve</button><button class="btn" onclick="adminAct(\'admin_reject\',\''+esc(u.tg_id)+'\')">Reject</button><button class="btn" onclick="openAdminRole(\''+esc(u.tg_id)+'\',\''+esc(u.role)+'\')">Role</button><button class="btn" onclick="openAdminLink(\''+esc(u.tg_id)+'\')">Link</button><button class="btn" onclick="adminAct(\'admin_unlink\',\''+esc(u.tg_id)+'\')">Unlink</button></div></div>'});c.innerHTML=h;}catch(e){c.innerHTML='Error '+esc(String(e).slice(0,500))}}
function openAdminRole(tid,cur){let sheet=document.getElementById('sheet');sheet.innerHTML='<h3>Set role '+esc(tid)+'</h3><label>Role (member/r4/r5/admin/superadmin)</label><input id="role_val" class="input" value="'+esc(cur)+'"><label>Extra perms (comma: rat_access,manage_templates...)</label><input id="role_extra" class="input" placeholder="rat_access"><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="sendAdminRole(\''+esc(tid)+'\')">Save</button><button class="btn" onclick="closeModal()">Close</button></div><div class="muted">Only superadmin can grant rat_access</div>';document.getElementById('modal').classList.add('open');}
async function sendAdminRole(tid){let role=document.getElementById('role_val').value.trim().toLowerCase();let extra=document.getElementById('role_extra').value.split(',').map(function(s){return s.trim()}).filter(Boolean);try{let r=await callRBAC({action:"admin_set_role",target_tg_id:tid,role:role,perms_extra:extra});alert(r.ok?'Saved':r.error);closeModal();loadAdmin();}catch(e){alert(String(e).slice(0,500))}}
function openAdminLink(tid){let sheet=document.getElementById('sheet');sheet.innerHTML='<h3>Link player '+esc(tid)+'</h3><label>Player ID (9-15 digits)</label><input id="link_pid" class="input" placeholder="145563254785"><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="sendAdminLink(\''+esc(tid)+'\')">Link</button><button class="btn" onclick="closeModal()">Close</button></div>';document.getElementById('modal').classList.add('open');}
async function sendAdminLink(tid){let pid=document.getElementById('link_pid').value.trim();try{let r=await callRBAC({action:"admin_link",target_tg_id:tid,player_id:pid});alert(r.ok?'Linked':r.error);closeModal();loadAdmin();}catch(e){alert(String(e).slice(0,500))}}
async function adminAct(act,tid){try{let r=await callRBAC({action:act,target_tg_id:tid});alert(r.ok?'OK '+act:r.error);loadAdmin();}catch(e){alert(String(e).slice(0,500))}}
async function doSearch(){let q=document.getElementById('q').value.trim();if(q.length<2){alert('2+ chars');return;}let box=document.getElementById('searchRes');box.style.display='block';box.textContent='Searching…';try{let r=await fetch(SAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q})});let t=await r.text();let j={};try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,120))}let d=j.result||j;let arr=d.found||[];if(!arr||arr.length===0)box.innerHTML='<div class="muted">'+esc(q)+' not found</div>';else{let h='<b>Found '+arr.length+'</b>';arr.forEach(function(p){h+='<div class="row" style="cursor:pointer" onclick="openPlayer(\''+esc(p.id)+'\')"><div><b>'+esc(p.nick)+'</b> <span class="muted">'+esc(p.id)+'</span></div><div><b>'+esc(p.alliance)+'</b> <span class="badge">'+String(p.power||0)+'</span></div></div>'});box.innerHTML=h;}}catch(e){box.innerHTML='Error '+esc(String(e));}}
async function openPlayer(id){let sheet=document.getElementById('sheet');sheet.innerHTML='Loading '+esc(id)+'…';document.getElementById('modal').classList.add('open');try{let d=await callPlayer(id);let p=d.player||d;if(!p||!p.id)throw new Error(d.error||'no player');let h='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+esc(p.nick)+' <span class="muted">'+esc(p.id)+'</span></h3><button class="btn" onclick="closeModal()">Close</button></div>';h+='<div class="muted">Alliance <b>'+esc(p.alliance)+'</b> <span class="muted">'+esc(p.alliance_id||'')+'</span> · Server '+esc(p.server)+' · Excluded '+String(p.excluded)+'</div>';h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0"><div class="card">Power <b>'+String(p.power||'—')+'</b><br>Rank '+String(p.rank||'—')+' · Castle '+String(p.castle||'—')+'</div><div class="card">Kills '+String(p.kills||'—')+'<br>Activity '+String(p.activity||'—')+'<br>Growth7 '+String(p.growth7d||'—')+'</div></div>';h+='<div class="muted">First '+esc(p.first_seen_fmt)+' · Last '+esc(p.last_seen_fmt)+'</div>';function histList(arr,title){if(!arr||arr.length===0) return '<div class="muted">'+title+': No data</div>';let h2='<div style="margin-top:8px"><b>'+title+' ('+arr.length+')</b>';arr.forEach(function(it){h2+='<div class="row"><span>'+esc(it.nick||it.alliance||it.power||'')+'</span><span class="muted">'+esc(it.fmt||'')+'</span></div>';});h2+='</div>';return h2;}h+=histList(p.nick_history,'Nick history');h+=histList(p.alliance_history,'Alliance history');if(p.alliance_id_history&&p.alliance_id_history.length>0){h+=histList(p.alliance_id_history.map(function(it){return {alliance: it.alliance+' ('+it.alliance_id+')', fmt: it.fmt}}),'Alliance ID history');}if(p.power_history&&p.power_history.length>0){let ph='<div style="margin-top:8px"><b>Power history ('+p.power_history.length+')</b>';p.power_history.forEach(function(it){ph+='<div class="row"><span>Power '+String(it.power||'—')+' R'+String(it.rank||'—')+' K'+String(it.kills||'—')+'</span><span class="muted">'+esc(it.fmt||'')+'</span></div>';});ph+='</div>';h+=ph;}sheet.innerHTML=h;}catch(e){sheet.innerHTML='<span style="color:#fb7185">Error '+esc(String(e))+'</span><br><button class="btn" onclick="closeModal()">Close</button>';}}
function closeModal(){document.getElementById('modal').classList.remove('open');}
load();
</script></body></html>
