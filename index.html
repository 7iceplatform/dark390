<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Конструктор</title>
<style>
    /* Стили самого приложения */
    body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        background-color: #2b323a; 
        color: #fff; 
        margin: 0; 
        padding: 10px; 
        display: flex; 
        flex-direction: column; 
        gap: 10px; 
        box-sizing: border-box; 
    }
    
    .panel { background-color: #36404a; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    
    /* Панель кнопок */
    .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .tool-btn { background: #4a90e2; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .tool-btn:active { background: #357abd; }
    .tool-btn.sys { background: #8e44ad; width: 100%; margin-top: 5px; }

    .color-palette { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .color-btn { width: 30px; height: 30px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
    
    /* Поле ввода */
    textarea { 
        width: 100%; height: 140px; padding: 10px; box-sizing: border-box; 
        border-radius: 5px; border: 1px solid #7f8c8d; background-color: #e8eef3; 
        color: #333; font-family: monospace; font-size: 14px; resize: none; 
    }
    
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .counter { font-size: 14px; color: #bdc3c7; font-weight: bold; }
    
    .btn-copy { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-copy:active { background-color: #27ae60; }

    /* --- ДИЗАЙН ПРЕДПРОСМОТРА (ТОЧЬ-В-ТОЧЬ КАК В ИГРЕ) --- */
    .preview-wrapper { background: transparent; padding: 0; }
    
    .game-window { 
        background-color: #e2e9f0; /* Цвет фона игры */
        color: #2c3e50; /* Цвет текста игры */
        padding: 12px 15px; 
        border-radius: 6px; 
        border: 1px solid #b0c4de;
        font-size: 15px; 
        line-height: 1.5; 
        word-wrap: break-word; 
        min-height: 150px;
        font-family: Arial, sans-serif;
    }
    
    /* Имитация тегов игры в предпросмотре */
    .game-window b { font-weight: bold; }
    .game-window i { font-style: italic; }
    .game-window u { text-decoration: underline; }
    
    /* Системная ссылка (ник) */
    .game-sys-tag { text-decoration: underline; font-weight: bold; }
</style>
</head>
<body>

<div class="panel">
    <!-- BB коды -->
    <div class="tools">
        <button class="tool-btn" onclick="wrapText('[b]', '[/b]')">[b] Жирный</button>
        <button class="tool-btn" onclick="wrapText('[i]', '[/i]')">[i] Курсив</button>
        <button class="tool-btn" onclick="wrapText('[u]', '[/u]')">[u] Подчеркнутый</button>
        <button class="tool-btn sys" onclick="insertSysTag()">Вставить ссылку на профиль (YurAri)</button>
    </div>
    
    <!-- Цвета -->
    <div class="color-palette">
        <div class="color-btn" style="background-color: #E67E22;" onclick="wrapText('[E67E22]', '[-]')"></div> <!-- Оранжевый -->
        <div class="color-btn" style="background-color: #1E88E5;" onclick="wrapText('[1E88E5]', '[-]')"></div> <!-- Синий -->
        <div class="color-btn" style="background-color: #E74C3C;" onclick="wrapText('[E74C3C]', '[-]')"></div> <!-- Красный -->
        <div class="color-btn" style="background-color: #2E7D32;" onclick="wrapText('[2E7D32]', '[-]')"></div> <!-- Зеленый -->
        <div class="color-btn" style="background-color: #8E44AD;" onclick="wrapText('[8E44AD]', '[-]')"></div> <!-- Фиолетовый -->
        <div class="color-btn" style="background-color: #D35400;" onclick="wrapText('[D35400]', '[-]')"></div> <!-- Темно-оранжевый -->
        <div class="color-btn" style="background-color: #333333;" onclick="wrapText('[333333]', '[-]')"></div> <!-- Темно-серый -->
        <div class="color-btn" style="background-color: #C0392B;" onclick="wrapText('[C0392B]', '[-]')"></div> <!-- Темно-красный -->
    </div>
    
    <!-- Поле ввода (связано с предпросмотром через CSS) -->
    <textarea id="inputArea" placeholder="Введите текст уведомления..."></textarea>
    
    <div class="action-bar">
        <div class="counter" id="charCount">0 / 1000</div>
        <button class="btn-copy" onclick="copyText()">📋 Копировать</button>
    </div>
</div>

<!-- Блок предпросмотра -->
<div class="preview-wrapper">
    <div class="game-window">
        <div id="previewArea"></div>
    </div>
</div>

<script>
    // Работа с кнопками
    const inputArea = document.getElementById('inputArea');

    function wrapText(openTag, closeTag) {
        const startPos = inputArea.selectionStart;
        const endPos = inputArea.selectionEnd;
        const text = inputArea.value;
        
        if (startPos !== endPos) {
            const selectedText = text.substring(startPos, endPos);
            inputArea.value = text.substring(0, startPos) + openTag + selectedText + closeTag + text.substring(endPos);
        } else {
            inputArea.value = text.substring(0, startPos) + openTag + closeTag + text.substring(endPos);
        }
        inputArea.focus();
        inputArea.setSelectionRange(startPos + openTag.length, startPos + openTag.length);
        renderPreview(); // Обновляем вручную, так как события могут блокироваться
    }

    function insertSysTag() {
        const sysText = '[c][1E88E5][[u][DARK]YurAri#:390 X:440 Y:493[/u]][-][/c]';
        inputArea.value += sysText;
        renderPreview();
    }

    // Функция обновления предпросмотра и счетчика
    function renderPreview() {
        let rawText = inputArea.value;
        
        // 1. Обновляем счетчик
        const count = rawText.length;
        const counter = document.getElementById('charCount');
        counter.textContent = count + ' / 1000';
        counter.style.color = count > 1000 ? '#e74c3c' : '#bdc3c7';

        // 2. Конвертируем BB-коды в HTML для предпросмотра
        let htmlText = rawText;

        // Наш кастомный цвет [XXXXXX]
        htmlText = htmlText.replace(/\[([0-9A-Fa-f]{6})\]/g, '<span style="color: #$1">');
        htmlText = htmlText.replace(/\[\-\]/g, '</span>');

        // Стандартные теги
        htmlText = htmlText.replace(/\[b\]/g, '<b>').replace(/\[\/b\]/g, '</b>');
        htmlText = htmlText.replace(/\[i\]/g, '<i>').replace(/\[\/i\]/g, '</i>');
        htmlText = htmlText.replace(/\[u\]/g, '<u>').replace(/\[\/u\]/g, '</u>');
        
        // Системная ссылка [c][COLOR] ... [-][/c]
        htmlText = htmlText.replace(/\[c\]\[([0-9A-Fa-f]{6})\](.*?)\[-\]\[\/c\]/g, '<span class="game-sys-tag" style="color: #$1">$2</span>');

        // Переносы строк
        htmlText = htmlText.replace(/\n/g, '<br>');

        // Вставляем результат в блок
        document.getElementById('previewArea').innerHTML = htmlText;
    }

    // Слушаем ввод в поле
    inputArea.addEventListener('input', renderPreview);

    // Копирование
    function copyText() {
        inputArea.select();
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        
        const btn = document.querySelector('.btn-copy');
        const originalText = btn.textContent;
        btn.textContent = '✅ Скопировано!';
        btn.style.backgroundColor = '#3498db';
        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '#2ecc71';
        }, 2000);
    }
</script>

</body>
</html>
