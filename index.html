<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Конструктор Уведомлений</title>
<style>
    :root {
        --bg-color: #2b323a;
        --panel-bg: #36404a;
        --game-bg: #DDE6ED; /* Точный цвет фона игры */
        --game-text: #1A202C; /* Точный цвет текста игры */
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px; height: 100vh; box-sizing: border-box; }
    
    .panel { background-color: var(--panel-bg); padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    
    .color-palette { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .color-btn { width: 32px; height: 32px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.8); }
    .color-btn:active { transform: scale(0.9); }
    
    textarea { width: 100%; height: 120px; padding: 8px; box-sizing: border-box; border-radius: 5px; border: none; background-color: #e8eef3; color: #333; font-family: monospace; font-size: 14px; resize: none; }
    
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .counter { font-size: 14px; color: #bdc3c7; font-weight: bold;}
    .counter.limit { color: #e74c3c; }
    
    .btn-copy { background-color: #2ecc71; color: white; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-copy:active { background-color: #27ae60; }
    .btn-copy.copied { background-color: #3498db; }

    /* Предпросмотр - точная копия игры */
    .preview-container { flex-grow: 1; overflow-y: auto; }
    .game-window { 
        background-color: var(--game-bg); 
        color: var(--game-text); 
        padding: 15px; 
        border-radius: 8px; 
        font-size: 15px; 
        line-height: 1.4; 
        word-wrap: break-word; 
        min-height: 150px;
        border: 1px solid #c0d0e0;
    }
    .game-window b { font-weight: 800; }
    .game-window i { font-style: italic; }
    .game-window u { text-decoration: underline; }
    
    /* Стиль для системного тега (координаты/ник) */
    .game-sys-tag { text-decoration: underline; font-weight: bold; }
</style>
</head>
<body>

<div class="panel">
    <div class="color-palette" id="palette">
        <!-- Цвета подобраны специально для светлого фона игры -->
        <div class="color-btn" style="background-color: #E67E22;" onclick="insertTag('[E67E22]', '[-]')">A</div> <!-- Оранжевый -->
        <div class="color-btn" style="background-color: #1E88E5;" onclick="insertTag('[1E88E5]', '[-]')">A</div> <!-- Синий -->
        <div class="color-btn" style="background-color: #E74C3C;" onclick="insertTag('[E74C3C]', '[-]')">A</div> <!-- Красный -->
        <div class="color-btn" style="background-color: #2E7D32;" onclick="insertTag('[2E7D32]', '[-]')">A</div> <!-- Зеленый -->
        <div class="color-btn" style="background-color: #8E44AD;" onclick="insertTag('[8E44AD]', '[-]')">A</div> <!-- Фиолетовый -->
        <div class="color-btn" style="background-color: #D35400;" onclick="insertTag('[D35400]', '[-]')">A</div> <!-- Темно-оранжевый -->
        <div class="color-btn" style="background-color: #333333;" onclick="insertTag('[333333]', '[-]')">A</div> <!-- Темно-серый -->
        <div class="color-btn" style="background-color: #C0392B;" onclick="insertTag('[C0392B]', '[-]')">A</div> <!-- Темно-красный -->
    </div>
    
    <textarea id="inputText" oninput="updatePreview()" placeholder="Введите текст..."></textarea>
    
    <div class="action-bar">
        <div class="counter" id="charCounter">0 / 1000</div>
        <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 Копировать</button>
    </div>
</div>

<div class="preview-container panel" style="padding:0; background:none; box-shadow:none;">
    <div class="game-window" id="previewText"></div>
</div>

<script>
    const inputArea = document.getElementById('inputText');
    const previewArea = document.getElementById('previewText');
    const counter = document.getElementById('charCounter');
    const copyBtn = document.getElementById('copyBtn');

    // Функция вставки тегов формата [ЦВЕТ]Текст[-]
    function insertTag(openTag, closeTag) {
        const startPos = inputArea.selectionStart;
        const endPos = inputArea.selectionEnd;
        const text = inputArea.value;
        
        if (startPos !== endPos) {
            const selectedText = text.substring(startPos, endPos);
            inputArea.value = text.substring(0, startPos) + openTag + selectedText + closeTag + text.substring(endPos);
        } else {
            inputArea.value = text.substring(0, startPos) + openTag + closeTag + text.substring(endPos);
        }
        
        inputArea.focus();
        inputArea.setSelectionRange(startPos + openTag.length, startPos + openTag.length);
        updatePreview();
    }

    // Кнопка копирования
    function copyToClipboard() {
        inputArea.select();
        document.execCommand('copy');
        // Сброс выделения
        window.getSelection().removeAllRanges();
        
        copyBtn.textContent = '✅ Скопировано!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
            copyBtn.textContent = '📋 Копировать';
            copyBtn.classList.remove('copied');
        }, 2000);
    }

    function updatePreview() {
        let text = inputArea.value;
        
        // Счетчик
        const length = text.length;
        counter.textContent = length + ' / 1000';
        counter.className = length > 1000 ? 'counter limit' : 'counter';

        // 1. Парсим теги [ЦВЕТ] ... [-] (ВАШ ФОРМАТ)
        // Ищем 6-значные hex-коды в скобках
        text = text.replace(/\[([0-9A-Fa-f]{6})\]/g, '<span style="color: #$1">');
        // Закрываем цвет тегом [-]
        text = text.replace(/\[\-\]/g, '</span>');

        // 2. Парсим стандартные теги
        text = text.replace(/\[b\]/g, '<b>').replace(/\[\/b\]/g, '</b>');
        text = text.replace(/\[i\]/g, '<i>').replace(/\[\/i\]/g, '</i>');
        text = text.replace(/\[u\]/g, '<u>').replace(/\[\/u\]/g, '</u>');
        
        // 3. Системный тег игры [c][ЦВЕТ][[u]Текст[/u]][-][/c]
        // Превращаем его в кликабельную ссылку для предпросмотра
        text = text.replace(/\[c\]\[([0-9A-Fa-f]{6})\](.*?)\[-\]\[\/c\]/g, '<span class="game-sys-tag" style="color: #$1">$2</span>');

        // Переносы строк
        text = text.replace(/\n/g, '<br>');

        previewArea.innerHTML = text;
    }
    
    updatePreview();
</script>

</body>
</html>
