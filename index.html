
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARK #390 — Last Asylum</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e6eef6;font:14px sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hero{background:#0e1a24;border:1px solid #1d2a36;border-radius:12px;padding:12px}
h1{font-size:22px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pill{background:#111820;border:1px solid #1d2a36;border-radius:10px;padding:8px;display:flex;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tab{padding:7px 10px;border-radius:999px;background:#111820;border:1px solid #1d2a36;color:#93a3b8;cursor:pointer;white-space:nowrap}
.tab.active{background:#0f2436;color:#fff}
.card{background:#111820;border:1px solid #1d2a36;border-radius:12px;padding:10px;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #15202c}
.row:last-child{border-bottom:0}
.muted{color:#93a3b8}
.search{display:flex;gap:6px;margin:8px 0}
.search input{min-width:0;flex:1;background:#0d1722;color:#fff;border:1px solid #1d2a36;border-radius:10px;padding:10px}
.btn{background:#123055;color:#fff;border:1px solid #20406a;border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:wait}
.status{margin-top:8px;font-size:12px;color:#93a3b8}
@media(max-width:420px){.wrap{padding:8px}h1{font-size:19px}.row{font-size:12px}.pill{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>DARK #390 — Last Asylum</h1>
    <div class="muted">
      <span id="interval">...</span> |
      <span id="now">...</span>
    </div>
    <div class="grid">
      <div class="pill"><span class="muted">Players</span><b id="total">...</b></div>
      <div class="pill"><span class="muted">DARK</span><b id="dark">...</b></div>
      <div class="pill"><span class="muted">Top</span><b id="topcount">...</b></div>
      <div class="pill"><span class="muted">Auto</span><b id="auto">...</b></div>
    </div>
  </div>

  <div class="search">
    <input id="q" placeholder="Search 2+ letters" autocomplete="off">
    <button id="searchBtn" class="btn" onclick="doSearch()">Find</button>
  </div>

  <div id="searchRes" class="card" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-t="roster" onclick="switchTab('roster')">Roster DARK</div>
    <div class="tab" data-t="top" onclick="switchTab('top')">Top #390</div>
    <div class="tab" data-t="transfers" onclick="switchTab('transfers')">Transfers</div>
    <div class="tab" data-t="new" onclick="switchTab('new')">New</div>
  </div>

  <div id="content" class="card">Loading...</div>

  <div class="status">
    <span id="src">...</span> |
    <span id="last">...</span>
    <button class="btn" onclick="load()" style="float:right;padding:4px 8px">Refresh</button>
  </div>
</div>

<script>
const API = 'https://api.telebotcreator.com/new-webhook?data=gAAAAABq2cVOwC3V69i9Uyv8cPjlKvq7VyzsDnKK69Euq5joaQ9Nbsy1LKVK6UPUnMkAyzwAs1xSAoMsodQ4ZfBmbdxaMCZgS5UJXqvqcRaKBU-1n8wbzQKqbW1pQ6w6y4wjLox1C_-XKfTUWW0tiaJpQy6vvI-ZLlPFDjZObYoViDqp-dW16B-Ehh16GowpY3C8ZEDpv3HS';

const SAPI = 'https://api.telebotcreator.com/new-webhook?data=gAAAAABq2cVO8pJTw1Fdm2CJmznORxS7jYeoVLnz8-_e4oiRNw8QXis7URmFGAPWLO6CM2rWLTkJ9vSg_NYO5ZBV2m9d9mA4Biool1GkAZ0wPGXJdlD2OoZ_VnjqqWHY8IQRlyZPWSfxIx3c-LmYW1E7me1qHlYa_UMkmnh4_-Fp8JbogxrnV0SZ0n8mBPtXuVU93zlv_yr2';

let DATA = null;
let currentTab = 'roster';
let loading = false;

function el(id) {
  return document.getElementById(id);
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showError(message) {
  el('content').innerHTML =
    '<span style="color:#fb7185">Error: ' + esc(message) + '</span>';
}

async function fetchJSON(url) {
  const response = await fetch(url, {cache: 'no-store'});
  const text = await response.text();

  let json;
  try {
    json = JSON.parse(text);
  } catch {
    throw new Error('API returned non-JSON (HTTP ' + response.status + ')');
  }

  if (!response.ok) {
    throw new Error('HTTP ' + response.status);
  }

  if (json && json.error) {
    throw new Error(
      typeof json.error === 'string'
        ? json.error
        : JSON.stringify(json.error)
    );
  }

  return json;
}

async function load() {
  if (loading) return;
  loading = true;
  el('content').textContent = 'Loading...';

  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const json = await fetchJSON(API);
    const data = json.result ?? json.data ?? json;

    if (!data || typeof data !== 'object') {
      throw new Error('Unexpected API response');
    }

    DATA = data;

    el('interval').textContent =
      data.interval != null ? (data.interval / 60) + 'm' : '-';

    el('now').textContent = data.fmt_now ?? '';
    el('total').textContent = data.total_players ?? '-';

    el('dark').textContent =
      data.dark_active ?? (Array.isArray(data.dark) ? data.dark.length : 0);

    el('topcount').textContent =
      Array.isArray(data.top) ? data.top.length : 0;

    el('auto').textContent = data.html_auto === true ? 'ON' : 'OFF';

    el('src').textContent = data.last_success
      ? data.last_success.source ?? 'html'
      : 'html';

    el('last').textContent = data.last_success
      ? (data.last_success.tag ?? '') + ' ' +
        (data.last_success.count ?? '')
      : '';

    switchTab(currentTab);
  } catch (error) {
    showError(error.message || String(error));
  } finally {
    loading = false;
  }
}

function switchTab(tab) {
  currentTab = tab;

  document.querySelectorAll('.tab').forEach(function(item) {
    item.classList.toggle('active', item.dataset.t === tab);
  });

  const content = el('content');

  if (!DATA) {
    content.textContent = 'Loading...';
    return;
  }

  let html = '';

  if (tab === 'roster') {
    const players = Array.isArray(DATA.dark) ? DATA.dark : [];

    if (!players.length) {
      html = '<div class="muted">Empty</div>';
    }

    players.forEach(function(player, index) {
      html += `
        <div class="row">
          <div>
            <span class="muted">${index + 1}.</span>
            <b>${esc(player.nick)}</b>
            <span class="muted">R${esc(player.rank || '-')}</span>
          </div>
          <div style="text-align:right">
            <b>${esc(player.power ?? 0)}</b><br>
            <span class="muted">${esc(player.id)}</span>
          </div>
        </div>`;
    });
  }

  else if (tab === 'top') {
    const alliances = Array.isArray(DATA.top) ? DATA.top : [];

    alliances.forEach(function(alliance, index) {
      html += `
        <div class="row">
          <div>
            ${index + 1}. <b>${esc(alliance.tag)}</b>
            <span class="muted">${esc(alliance.id)}</span>
          </div>
          <div><b>${esc(alliance.members ?? '-')}</b></div>
        </div>`;
    });

    if (!html) html = '<div class="muted">Нет данных</div>';
  }

  else if (tab === 'transfers') {
    const transfers = Array.isArray(DATA.transfers)
      ? DATA.transfers : [];

    transfers.forEach(function(event) {
      html += `
        <div class="row">
          <div>
            <b>${esc(event.nick)}</b>
            <span class="muted">${esc(event.pid)}</span>
          </div>
          <div style="text-align:right">
            <div class="muted">${esc(event.fmt)}</div>
            <div>${esc(event.from)} → <b>${esc(event.to)}</b></div>
          </div>
        </div>`;
    });

    if (!html) html = '<div class="muted">Нет переходов 7д</div>';
  }

  else if (tab === 'new') {
    const players = Array.isArray(DATA.new_players)
      ? DATA.new_players : [];

    players.forEach(function(player) {
      html += `
        <div class="row">
          <div>
            <b>${esc(player.nick)}</b>
            <span class="muted">${esc(player.pid)}</span>
            → <b>${esc(player.alliance)}</b>
          </div>
          <div class="muted">${esc(player.fmt)}</div>
        </div>`;
    });

    if (!html) html = '<div class="muted">Нет новых 7д</div>';
  }

  content.innerHTML = html;
}

async function doSearch() {
  const query = el('q').value.trim();

  if (query.length < 2) {
    el('searchRes').style.display = 'block';
    el('searchRes').textContent = 'Введите минимум 2 символа';
    return;
  }

  const box = el('searchRes');
  const button = el('searchBtn');

  box.style.display = 'block';
  box.textContent = 'Search...';
  button.disabled = true;

  try {
    const url = SAPI + '&q=' + encodeURIComponent(query);
    const json = await fetchJSON(url);
    const data = json.result ?? json.data ?? json;
    const found = Array.isArray(data.found) ? data.found : [];

    if (!found.length) {
      box.innerHTML =
        '<div class="muted">' + esc(query) + ' не найдено</div>';
      return;
    }

    let html = '<b>Найдено ' + found.length + '</b>';

    found.forEach(function(player) {
      html += `
        <div class="row">
          <div>
            <b>${esc(player.nick)}</b>
            <span class="muted">${esc(player.id)}</span>
          </div>
          <div><b>${esc(player.alliance)}</b></div>
        </div>`;
    });

    box.innerHTML = html;
  } catch (error) {
    box.innerHTML =
      '<span style="color:#fb7185">Error: ' +
      esc(error.message || String(error)) + '</span>';
  } finally {
    button.disabled = false;
  }
}

el('q').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') doSearch();
});

load();

// Обновление данных каждые 5 минут.
setInterval(function() {
  if (!document.hidden) load();
}, 5 * 60 * 1000);
</script>
</body>
</html>
