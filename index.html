<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARK #390 — Last Asylum</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0b0f14;color:#e6eef6;font:14px sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hero{background:#0e1a24;border:1px solid #1d2a36;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pill{background:#111820;border:1px solid #1d2a36;border-radius:10px;padding:8px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin:10px 0;overflow:auto}
.tab{padding:7px 10px;border-radius:999px;background:#111820;border:1px solid #1d2a36;color:#93a3b8;cursor:pointer;white-space:nowrap}
.tab.active{background:#0f2436;color:#fff}
.card{background:#111820;border:1px solid #1d2a36;border-radius:12px;padding:10px}
.row{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #15202c}
.badge{font-size:11px;padding:2px 6px;border-radius:999px;background:#0e2233;border:1px solid #1e3a52;color:#9ecbff}
.search{display:flex;gap:6px;margin:8px 0}
.search input{flex:1;background:#0d1722;color:#fff;border:1px solid #1d2a36;border-radius:10px;padding:8px}
.btn{background:#123055;color:#fff;border:1px solid #20406a;border-radius:10px;padding:8px 12px;cursor:pointer}
.muted{color:#93a3b8}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>DARK #390 — Last Asylum</h1>
<div class="muted"><span id="interval">...</span> | <span id="now">...</span></div>
<div class="grid">
<div class="pill"><span class="muted">Players</span><b id="total">...</b></div>
<div class="pill"><span class="muted">DARK</span><b id="dark">...</b></div>
<div class="pill"><span class="muted">Top</span><b id="topcount">...</b></div>
<div class="pill"><span class="muted">Auto</span><b id="auto">...</b></div>
</div></div>

<div class="search"><input id="q" placeholder="Поиск 2+ буквы"><button class="btn" onclick="doSearch()">Найти</button></div>
<div id="searchRes" class="card" style="display:none"></div>
<div class="tabs">
<div class="tab active" data-t="roster" onclick="switchTab('roster')">Ростер DARK</div>
<div class="tab" data-t="top" onclick="switchTab('top')">Топ #390</div>
<div class="tab" data-t="transfers" onclick="switchTab('transfers')">Переходы</div>
<div class="tab" data-t="new" onclick="switchTab('new')">Новые</div>
</div>
<div id="content" class="card">Загрузка...</div>
<div class="muted" style="margin-top:8px;font-size:11px"><span id="src">...</span> | <span id="last">...</span></div>
</div>

<script>
const API='https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_87d33343';
const SAPI='https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_cf51413c';
let DATA=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
async function load(){
 try{
  let tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
  let r=await fetch(API,{method:'POST',body:'{}'});
  let t=await r.text(); let j={}; try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,80))}
  let d=j.result||j.data||j; if(d&&d.error) throw new Error(d.error);
  DATA=d;
  document.getElementById('interval').textContent=(d.interval?(d.interval/60)+'м':'-');
  document.getElementById('now').textContent=d.fmt_now||'';
  document.getElementById('total').textContent=d.total_players??'-';
  document.getElementById('dark').textContent=d.dark_active??(d.dark?d.dark.length:'0');
  document.getElementById('topcount').textContent=d.top?d.top.length:'0';
  document.getElementById('auto').textContent=(d.html_auto===true?'ON':'OFF');
  document.getElementById('src').textContent=(d.last_success?d.last_success.source:'html');
  document.getElementById('last').textContent=(d.last_success?(d.last_success.tag+' '+d.last_success.count):'');
  switchTab('roster');
 }catch(e){document.getElementById('content').innerHTML='<span style="color:#fb7185">Error '+esc(String(e))+'</span>';}
}
function switchTab(t){
 document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.t===t)});
 let c=document.getElementById('content'); if(!DATA){c.textContent='Загрузка...';return;}
 if(t==='roster'){
  let h=''; let dark=DATA.dark||[]; if(dark.length===0) h='<div class="muted">Пусто</div>';
  else dark.forEach(function(p,i){h+='<div class="row"><div><span class="muted">'+String(i+1)+'.</span> <b>'+esc(p.nick)+'</b> <span class="badge">R'+esc(p.rank||'-')+'</span></div><div style="text-align:right"><b>'+String(p.power||0)+'</b><br><span class="muted">'+esc(p.id)+'</span></div></div>';});
  c.innerHTML=h;
 } else if(t==='top'){
  let h=''; (DATA.top||[]).forEach(function(a,i){h+='<div class="row"><div>'+String(i+1)+'. <b>'+esc(a.tag)+'</b> <span class="muted">'+esc(a.id)+'</span></div><div><b>'+a.members+'</b></div></div>';}); c.innerHTML=h||'Нет данных';
 } else if(t==='transfers'){
  let h=''; (DATA.transfers||[]).forEach(function(e){h+='<div class="row"><div><b>'+esc(e.nick)+'</b> <span class="muted">'+esc(e.pid)+'</span></div><div style="text-align:right"><div class="muted">'+esc(e.fmt)+'</div><div>'+esc(e.from)+' to <b>'+esc(e.to)+'</b></div></div></div>';}); c.innerHTML=h||'Нет переходов 7д';
 } else if(t==='new'){
  let h=''; (DATA.new_players||[]).forEach(function(e){h+='<div class="row"><div><b>'+esc(e.nick)+'</b> <span class="muted">'+esc(e.pid)+'</span> to <b>'+esc(e.alliance)+'</b></div><div class="muted">'+esc(e.fmt)+'</div></div>';}); c.innerHTML=h||'Нет новых 7д';
 }
}
async function doSearch(){
 let q=document.getElementById('q').value.trim(); if(q.length<2){alert('2+');return;}
 let box=document.getElementById('searchRes'); box.style.display='block'; box.textContent='Поиск...';
 try{
  let r=await fetch(SAPI,{method:'POST',body:JSON.stringify({q:q})});
  let t=await r.text(); let j={}; try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,80))}
  let d=j.result||j.data||j; let arr=d.found||[]; if(!arr||arr.length===0) box.innerHTML='<div class="muted">'+esc(q)+' не найдено</div>';
  else{let h='<b>Найдено '+arr.length+'</b>'; arr.forEach(function(p){h+='<div class="row"><div><b>'+esc(p.nick)+'</b> <span class="muted">'+esc(p.id)+'</span></div><div><b>'+esc(p.alliance)+'</b></div></div>'}); box.innerHTML=h;}
 }catch(e){box.innerHTML='Error '+esc(String(e));}
}
load();
</script>
</body>
</html>
