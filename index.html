<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор Уведомлений</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .container { display: flex; gap: 15px; flex-wrap: wrap; }
    .panel { background-color: #34495e; padding: 15px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    
    .bb-tools { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .bb-btn { background-color: #4a90e2; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;}
    .bb-btn:hover { background-color: #357abd; }
    .bb-btn.red { background-color: #e74c3c; }
    .bb-btn.green { background-color: #2ecc71; }
    .bb-btn.orange { background-color: #e67e22; }
    
    textarea { width: 100%; height: 250px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #7f8c8d; background-color: #ecf0f1; color: #2c3e50; font-family: monospace; font-size: 14px; resize: vertical; }
    .counter { text-align: right; margin-top: 5px; font-size: 14px; color: #bdc3c7; }
    .counter.limit { color: #e74c3c; font-weight: bold; }

    .preview-panel { background-color: #1a252f; padding: 10px; border-radius: 8px; flex: 1; min-width: 300px; }
    .game-window { background-color: #e8eef3; color: #333; padding: 15px; border-radius: 8px; border: 2px solid #bdc3c7; font-size: 14px; line-height: 1.5; min-height: 250px; word-wrap: break-word; }
    .game-window b { font-weight: 800; }
    .game-window i { font-style: italic; }
    .game-window u { text-decoration: underline; }
    
    .game-sys-tag { color: #1E88E5; text-decoration: underline; font-weight: bold; }
</style>
</head>
<body>

<h2>🛠 Конструктор уведомлений</h2>

<div class="container">
    <div class="panel">
        <h3>Ввод текста</h3>
        <div class="bb-tools">
            <button class="bb-btn" onclick="insertText('[b]', '[/b]')">[b] Жирный</button>
            <button class="bb-btn" onclick="insertText('[i]', '[/i]')">[i] Курсив</button>
            <button class="bb-btn" onclick="insertText('[u]', '[/u]')">[u] Подчеркнутый</button>
            <button class="bb-btn red" onclick="insertText('[color=#E74C3C]', '[/color]')">Красный</button>
            <button class="bb-btn" onclick="insertText('[color=#5B9DFF]', '[/color]')">Синий</button>
            <button class="bb-btn green" onclick="insertText('[color=#2E7D32]', '[/color]')">Зеленый</button>
            <button class="bb-btn orange" onclick="insertText('[color=#E67E22]', '[/color]')">Оранжевый</button>
            <button class="bb-btn" onclick="insertText('[c][1E88E5][[u][DARK]Ник#:123 X:123 Y:123[/u]][-][/c]', '')">Ссылка на профиль</button>
        </div>
        
        <textarea id="inputText" oninput="updatePreview()" placeholder="Введите ваш текст здесь..."></textarea>
        <div class="counter" id="charCounter">0 / 1000</div>
    </div>

    <div class="panel preview-panel">
        <h3>Предпросмотр (как в игре)</h3>
        <div class="game-window" id="previewText"></div>
    </div>
</div>

<script>
    const inputArea = document.getElementById('inputText');
    const previewArea = document.getElementById('previewText');
    const counter = document.getElementById('charCounter');

    function insertText(openTag, closeTag) {
        const startPos = inputArea.selectionStart;
        const endPos = inputArea.selectionEnd;
        const text = inputArea.value;
        
        if (startPos !== endPos) {
            const selectedText = text.substring(startPos, endPos);
            inputArea.value = text.substring(0, startPos) + openTag + selectedText + closeTag + text.substring(endPos);
        } else {
            inputArea.value = text.substring(0, startPos) + openTag + closeTag + text.substring(endPos);
        }
        
        inputArea.focus();
        inputArea.setSelectionRange(startPos + openTag.length, startPos + openTag.length);
        updatePreview();
    }

    function updatePreview() {
        let text = inputArea.value;
        
        const length = text.length;
        counter.textContent = length + ' / 1000';
        if (length > 1000) {
            counter.classList.add('limit');
        } else {
            counter.classList.remove('limit');
        }

        text = text.replace(/\[b\]/g, '<b>').replace(/\[\/b\]/g, '</b>');
        text = text.replace(/\[i\]/g, '<i>').replace(/\[\/i\]/g, '</i>');
        text = text.replace(/\[u\]/g, '<u>').replace(/\[\/u\]/g, '</u>');
        text = text.replace(/\[color=(#[0-9a-fA-F]{6})\]/g, '<span style="color: $1">').replace(/\[\/color\]/g, '</span>');
        
        text = text.replace(/\[c\]\[(.*?)\]\[\[u\](.*?)\[\/u\]\]\[-\]\[\/c\]/g, '<span class="game-sys-tag" style="color:$1">$2</span>');

        text = text.replace(/\n/g, '<br>');

        previewArea.innerHTML = text;
    }
    
    updatePreview();
</script>

</body>
</html>
